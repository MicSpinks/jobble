{% extends 'base.html' %}
{% block content %}

<style>
  /* --- Georgia Tech Inspired Modern Login --- */
  body {
    font-family: 'Inter', sans-serif;
    background: #f7f9fc;
    color: #1a1a1a;
  }

  .login-card {
    background: #ffffff;
    border: none;
    border-radius: 16px;
    padding: 2rem;
    box-shadow: 0 6px 30px rgba(0, 0, 0, 0.1);
    animation: fadeIn 0.5s ease;
  }

  h2 {
    font-weight: 700;
    text-align: center;
    color: #003057; /* GT Navy */
  }

  .login-subtitle {
    text-align: center;
    color: #555;
    font-size: 0.95rem;
  }

  label {
    font-weight: 500;
    color: #003057;
  }

  .form-control {
    background: #f1f4f8;
    border: 1px solid #c9d3e1;
    border-radius: 10px;
    padding: 12px;
    color: #1a1a1a;
    transition: all 0.3s ease;
  }

  .form-control:focus {
    border-color: #b3a369; /* GT Gold */
    box-shadow: 0 0 0 2px rgba(179, 163, 105, 0.4);
    background: #fff;
  }

  .btn-modern {
    width: 100%;
    margin-top: 20px;
    padding: 12px 0;
    background: #003057; /* Navy */
    color: #fff;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .btn-modern:hover {
    background: #b3a369; /* Gold hover */
    color: #003057;
    transform: translateY(-2px);
  }

  .alert-danger {
    background-color: #ffe8e8;
    border: 1px solid #ffb3b3;
    border-radius: 10px;
    color: #a30000;
  }

  .signup-link {
    text-align: center;
    margin-top: 20px;
    font-size: 0.95rem;
    color: #555;
  }

  .signup-link a {
    color: #003057;
    text-decoration: underline;
    font-weight: 600;
  }

  .signup-link a:hover {
    color: #b3a369;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>

<div class="p-3 mt-4">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="login-card">
          <div class="card-body">
            <h2>Welcome Back</h2>
            <p class="login-subtitle">Log in to your Georgia Tech account</p>
            <hr style="border-color: #e0e0e0;" />

            {% if template_data.error %}
            <div class="alert alert-danger" role="alert">
              {{ template_data.error }}
            </div>
            {% endif %}

            <form method="POST">
              {% csrf_token %}
              <div class="mb-3">
                <label for="username">Username</label>
                <input id="username" type="text"
                       name="username" required
                       autocomplete="username"
                       class="form-control">
              </div>

              <div class="mb-3">
                <label for="password">Password</label>
                <input id="password" type="password"
                       name="password" required
                       autocomplete="current-password"
                       class="form-control">
              </div>

              <div class="text-center">
                <button type="submit" class="btn-modern">Log In</button>
              </div>

              <div class="signup-link">
                <p>Don’t have an account? 
                  <a href="{% url 'accounts.signup' %}">Sign up</a>
                </p>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock content %}
