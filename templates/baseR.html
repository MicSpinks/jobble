<!DOCTYPE html>
<html>
  {% load static %}
  <head>
    <title>{{ template_data.title }}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
  </head>
  <body>
    <div class="d-flex">
      <!-- Sidebar -->
      <nav class="sidebar d-flex flex-column align-items-center">
        <!-- Logo -->
        <div class="testsvg d-flex align-items-center justify-content-center mb-3">
          <a href="{% url 'Rhome.index' %}" class="d-flex align-items-center">
            <img src="{% static 'img/Logo.svg' %}" width="100%" height="100%" alt="Logo">
          </a>
        </div>
        <hr>

        <!-- Nav links -->
        <ul class="nav flex-column mb-auto w-100 text-center">
          <li class="nav-item">
            <div class="test d-flex align-items-center justify-content-center">
              <a href="{% url 'job_list' %}" class="nav-link">
                <i class="fa-solid fa-briefcase me-2"></i> Post Jobs
              </a>
            </div>
          </li>

          <li class="nav-item">
            <div class="test d-flex align-items-center justify-content-center">
              <a href="{% url 'Rhome.searchcandidates' %}" class="nav-link">
                <i class="fa-solid fa-magnifying-glass me-2"></i> Search Candidates
              </a>
            </div>
          </li>

          <li class="nav-item">
            <div class="test d-flex align-items-center justify-content-center">
              <a href="{% url 'Rhome.organizeapplicants' %}" class="nav-link">
                <i class="fa-solid fa-folder-tree me-2"></i> Organize Applicants
              </a>
            </div>
          </li>

          <li class="nav-item">
            <div class="test d-flex align-items-center justify-content-center">
              <a href="{% url 'Rhome.messages' %}" class="nav-link">
                <i class="fa-solid fa-envelope me-2"></i> Messages
              </a>
            </div>
          </li>
        </ul>

        <hr>

        <!-- Bottom section -->
        <div class="nav flex-column test2 text-center w-100">
          <div class="nav-item test d-flex align-items-center justify-content-center">
            <a href="#" class="nav-link">
              <i class="fa-solid fa-gear me-2"></i> Settings
            </a>
          </div>

          <div class="test d-flex align-items-center justify-content-center">
            {% if user.is_authenticated %}
              <a class="nav-link" href="{% url 'accounts.logout' %}">
                <i class="fa-solid fa-right-from-bracket me-2"></i> Logout, {{ user.username }}?
              </a>
            {% else %}
              <a class="nav-link" href="{% url 'accounts.login' %}">
                <i class="fa-solid fa-right-to-bracket me-2"></i> Login
              </a>
            {% endif %}
          </div>
        </div>
      </nav>

      <!-- Main content -->
      <div class="main-content">
        {% block content %}
        {% endblock content %}
      </div>
    </div>
  </body>
</html>
