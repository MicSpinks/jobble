<!DOCTYPE html>
<html>
{% load static %}
<head>
  <title>{{ template_data.title }}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
<div class="d-flex">
  <!-- Sidebar -->
  <nav class="sidebar d-flex flex-column align-items-center">
    <div class="testsvg d-flex align-items-center justify-content-center">
      <a href="#" class="d-flex align-items-center">
        <img class="star" src="{% static 'img/Logo.svg' %}" alt="">
      </a>
    </div>
    <hr>
    <ul class="nav flex-column mb-auto">
      <li class="nav-item">
        <div class="test d-flex align-items-center justify-content-center">
          <a href="{% url 'Ahome.manageusers' %}" class="nav-link"><i class="fas fa-users me-2"></i>Manage Users</a>
        </div>
      </li>
      <li class="nav-item">
        <div class="test d-flex align-items-center justify-content-center">
          <a href="{% url 'Ahome.manageposts' %}" class="nav-link"><i class="fas fa-briefcase me-2"></i>Manage Job Postings</a>
        </div>
      </li>
    </ul>
    <hr>
  <div class="nav flex-column test2">
      <div class="test d-flex align-items-center justify-content-center">
    <!--     <a href="#" class="nav-link"><i class="fas fa-cog me-2"></i>Settings</a> -->
      </div> 
      <div class="test d-flex align-items-center justify-content-center">
        {% if user.is_authenticated %}
          <a class="nav-link" href="{% url 'accounts.logout' %}"><i class="fas fa-sign-out-alt me-2"></i>Logout, {{ user.username }}?</a>
        {% else %}
          <a class="nav-link" href="{% url 'accounts.login' %}"><i class="fas fa-sign-in-alt me-2"></i>Login</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <div class="main-content">
    {% block content %}{% endblock %}
  </div>
</div>
{% block scripts %}{% endblock %}
</body>
</html>
