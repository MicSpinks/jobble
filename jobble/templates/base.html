<!DOCTYPE html>
<html>
    {% load static %}
  <head>
  <title>{{ template_data.title }}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"crossorigin="anonymous">
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&display=swap" rel="stylesheet"><meta name="viewport" content="width=device-width,initial-scale=1" />
  </head>
  <body>
<nav class="sidebar d-flex flex-column align-items-center">
  <div class="testsvg d-flex align-items-center justify-content-center">
    <a href="{% url 'home.index' %}" class="d-flex align-items-center">
      <img class="star" src="{% static 'img/Logo.svg' %}" width="100%" height="100%" alt="">
    </a>
  </div>
  <hr>
  <ul class="nav flex-column mb-auto">
    <li class="nav-item">
      <div class="test d-flex align-items-center justify-content-center">
        <a href="{% url 'accounts.edit_profile' %}" class="nav-link">
          <i class="fa-solid fa-user"></i> <span>Profile</span>
        </a>
      </div>
    </li>
    <li class="nav-item">
      <div class="test d-flex align-items-center justify-content-center">
        <a href="{% url 'applications:my_applications' %}" class="nav-link">
          <i class="fa-solid fa-file-alt"></i> <span>My Applications</span>
        </a>
      </div>
    </li>
    <li class="nav-item">
      <div class="test d-flex align-items-center justify-content-center">
        <a href="{% url 'home.jobs' %}" class="nav-link">
          <i class="fa-solid fa-briefcase"></i> <span>Job Search</span>
        </a>
      </div>
    </li>
    <li class="nav-item">
      <div class="test d-flex align-items-center justify-content-center">
        <a href="{% url 'home.maps' %}" class="nav-link">
          <i class="fa-solid fa-map"></i> <span>Map</span>
        </a>
      </div>
    </li>
    <li class="nav-item">
      <div class="test d-flex align-items-center justify-content-center">
        <a href="{% url 'messaging:user_inbox' %}" class="nav-link">
          <i class="fa-solid fa-envelope"></i> <span>Messages</span>
        </a>
      </div>
    </li>
  </ul>
  <hr>
  <div class="nav flex-column test2">
    <div class="test d-flex align-items-center justify-content-center">
      {% if user.is_authenticated %}
        <a class="nav-link" href="{% url 'accounts.logout' %}">
          <i class="fa-solid fa-sign-out-alt"></i> <span>Logout, {{ user.username }}?</span>
        </a>
      {% else %}
        <a class="nav-link" href="{% url 'accounts.login' %}">
          <i class="fa-solid fa-sign-in-alt"></i> <span>Login</span>
        </a>
      {% endif %}
    </div>
  </div>
</nav>
    <!-- Main content -->
     <div class="main-content">
    {% block content %}
    {% endblock content %}
    </div>
    <!-- Main content -->
</body>
</html>
